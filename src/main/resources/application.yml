spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/chatbot_saas
    username: postgres
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto:  update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

server:
  servlet:
    context-path: /app
  port: 8000

app:
  python-service-url: http://localhost:8000
  upload-dir: uploads